[package]
name = "gray-chatgpt"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Sign in with ChatGPT (plan usage) provider plugin for the gray agent harness"
authors = ["Daniel Ou"]
repository = "https://github.com/DanielOu1208/gray-chatgpt"
homepage = "https://github.com/DanielOu1208/gray-chatgpt"
keywords = ["gray", "plugin", "chatgpt", "oauth", "agent"]

[lib]
name = "gray_chatgpt"
path = "src/lib.rs"

[[bin]]
name = "gray-chatgpt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
gray-core = { git = "https://github.com/vstaln/gray.git" }
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
strip = true
